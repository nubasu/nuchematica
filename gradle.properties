kotlin.code.style=official
kotlin.stdlib.default.dependency=false
# -Dfile.encoding=COMPAT restores the native platform encoding on JDK 18+ (JEP 400).
# Without it the Gradle daemon writes the test-worker classpath argfile in UTF-8 while
# the JDK 17 launcher decodes it in the native code page, which corrupts non-ASCII
# project paths and makes test classes unloadable.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=COMPAT
org.gradle.daemon=false

mcVersion=1.18.2

forgeVersion=40.3.0

kotlinVersion=1.8.22
coroutinesVersion=1.7.1
serializationVersion = 1.5.1
mockkVersion = 1.13.10